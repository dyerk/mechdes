<!DOCTYPE HTML>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Planetary Gearsets</title>

        <!-- Bootstrap 5 CSS & FontAwesome 6 -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

        <!-- Shared Components Loader Script -->
        <script src="/js_common/load_components.js" defer></script>

        <!-- Custom Stylesheet & Favicon -->
        <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon/favicon-32x32.png">
        <link rel="stylesheet" href="/css/canvas.css">

        <!-- Common JavaScript links -->
        <script src="/js_common/Linkage.js" defer></script>
        <script src="/js_common/Plot.js" defer></script>
        <script src="/js_common/Select_Animation.js" defer></script>
        <script src="/js_common/Common_Shapes.js" defer></script>

        <!-- Page-Specific JavaScript links -->
        <script src="/js_common/Common_Shapes_Planetary.js" defer></script>
        <script src="/js_common/Class_PlanS2P2.js" defer></script>
        <script src="/js_common/Class_PlanS2P3.js" defer></script>
        <script src="/js_common/Class_PlanS2P4.js" defer></script>
        <script src="/pages/gears/js/sunPlanet.js" defer></script>
    </head>

    <body class="bg-dark text-light d-flex flex-column min-vh-100">
        <!-- NAVIGATION CONTAINER -->
        <header id="navbar-placeholder" data-nav-path="/includes/navbar.html"></header>

        <!-- PAGE CONTENT -->
        <main class="container my-4 flex-grow-1 bg-white text-dark p-4 rounded-3">
            <header class="mb-4">
                <h1 class="h2">Planetary Gearsets</h1>
                <h2 class="h4 text-muted">Sun &amp; Planet Planetary Gearsets</h2>
            </header>

            <!-- Animation Selection Navigation (Nav Pills) -->
            <nav aria-label="Animation Selection" class="mt-3 border-bottom border-3">
                <ul id="sliderLinks" class="nav nav-pills justify-content-center bg-light p-2 rounded-top border" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button class="nav-link itemLinks active" data-pos="0" id="pill-s2p2-tab" type="button" role="tab" aria-selected="true">
                            2 Suns &amp; 2 Planets
                        </button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link itemLinks" data-pos="1" id="pill-s2p3-tab" type="button" role="tab" aria-selected="false">
                            2 Suns &amp; 3 Planets
                        </button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link itemLinks" data-pos="2" id="pill-s2p4-tab" type="button" role="tab" aria-selected="false">
                            2 Suns &amp; 4 Planets
                        </button>
                    </li>
                </ul>
            </nav>

            <!-- ITEM 07: 2 Suns & 2 Planets -->
            <section id="item07" class="animationContainer mb-4">
                <div class="row g-4 align-items-start">
                    
                    <!-- Left Column: Canvas Animation & Controls -->
                    <div class="col-12">
                        <figure class="figure w-100 m-0">
                            <div class="animationCanvas border rounded-bottom p-2 bg-light">
                                <div class="canvas-wrapper position-relative">
                                    <canvas class="canTrace" id="07canTr" width="500" height="400"></canvas>
                                    <canvas class="canDraw z_2" id="07canM1" width="500" height="400"></canvas>
                                    <canvas class="canDraw z_3" id="07canM2" width="500" height="400"></canvas>
                                    <canvas class="canDraw z_4" id="07canM3" width="500" height="400"></canvas>
                                    <canvas class="canDraw z_5" id="07canGr" width="500" height="400"></canvas>
                                </div>

                                <!-- Animation Controls -->
                                <div class="d-flex justify-content-center gap-3 mt-3">
                                    <button type="button" class="btn btn-outline-primary" id="07btnPlay" aria-label="Play animation">
                                        <i class="fa-solid fa-circle-play fa-2xl" id="07butPlay" aria-hidden="true"></i>
                                    </button>
                                    <button type="button" class="btn btn-outline-secondary" id="07btnReset" aria-label="Reset animation">
                                        <i class="fa-solid fa-rotate-right fa-2xl button-disabled" id="07butReset" aria-hidden="true"></i>
                                    </button>
                                </div>
                            </div>

                            <figcaption class="figure-caption text-center mt-2">
                                <h3 id="07cap" class="h6 mb-0 fw-semibold">Two suns and two planets.</h3>
                            </figcaption>
                        </figure>
                    </div>

                </div>
            </section>

            <!-- ITEM 08: 2 Suns & 3 Planets -->
            <section id="item08" class="animationContainer mb-4 d-none">

                    <!-- Left Column: Canvas Animation & Controls -->
                    <div class="col-12">
                        <figure class="figure w-100 m-0">
                            <div class="animationCanvas border rounded-bottom p-2 bg-light">
                                <div class="canvas-wrapper position-relative">
                                    <canvas class="canTrace" id="08canTr" width="500" height="400"></canvas>
                                    <canvas class="canDraw z_2" id="08canM1" width="500" height="400"></canvas>
                                    <canvas class="canDraw z_3" id="08canM2" width="500" height="400"></canvas>
                                    <canvas class="canDraw z_4" id="08canM3" width="500" height="400"></canvas>
                                    <canvas class="canDraw z_5" id="08canGr" width="500" height="400"></canvas>
                                </div>

                                <!-- Animation Controls -->
                                <div class="d-flex justify-content-center gap-3 mt-3">
                                    <button type="button" class="btn btn-outline-primary" id="08btnPlay" aria-label="Play animation">
                                        <i class="fa-solid fa-circle-play fa-2xl" id="08butPlay" aria-hidden="true"></i>
                                    </button>
                                    <button type="button" class="btn btn-outline-secondary" id="08btnReset" aria-label="Reset animation">
                                        <i class="fa-solid fa-rotate-right fa-2xl button-disabled" id="08butReset" aria-hidden="true"></i>
                                    </button>
                                </div>
                            </div>

                            <figcaption class="figure-caption text-center mt-2">
                                <h3 id="08cap" class="h6 mb-0 fw-semibold">Two suns and three planets.</h3>
                            </figcaption>
                        </figure>
                    </div>

                </div>
            </section>

            <!-- ITEM 09: 2 Suns & 4 Planets -->
            <section id="item09" class="animationContainer mb-4 d-none">
                <div class="row g-4 align-items-start">
                    
                    <!-- Left Column: Canvas Animation & Controls -->
                    <div class="col-12">
                        <figure class="figure w-100 m-0">
                            <div class="animationCanvas border rounded-bottom p-2 bg-light">
                                <div class="canvas-wrapper position-relative">
                                    <canvas class="canTrace" id="09canTr" width="500" height="400"></canvas>
                                    <canvas class="canDraw z_2" id="09canM1" width="500" height="400"></canvas>
                                    <canvas class="canDraw z_3" id="09canM2" width="500" height="400"></canvas>
                                    <canvas class="canDraw z_4" id="09canM3" width="500" height="400"></canvas>
                                    <canvas class="canDraw z_5" id="09canGr" width="500" height="400"></canvas>
                                </div>

                                <!-- Animation Controls -->
                                <div class="d-flex justify-content-center gap-3 mt-3">
                                    <button type="button" class="btn btn-outline-primary" id="09btnPlay" aria-label="Play animation">
                                        <i class="fa-solid fa-circle-play fa-2xl" id="09butPlay" aria-hidden="true"></i>
                                    </button>
                                    <button type="button" class="btn btn-outline-secondary" id="09btnReset" aria-label="Reset animation">
                                        <i class="fa-solid fa-rotate-right fa-2xl button-disabled" id="09butReset" aria-hidden="true"></i>
                                    </button>
                                </div>
                            </div>

                            <figcaption class="figure-caption text-center mt-2">
                                <h3 id="09cap" class="h6 mb-0 fw-semibold">Two suns and four planets.</h3>
                            </figcaption>
                        </figure>
                    </div>

                </div>
            </section>
        </main>

        <!-- FOOTER CONTAINER -->
        <footer id="footer-placeholder" data-footer-path="/includes/footer.html"></footer>

        <!-- Bootstrap JS Bundle -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
