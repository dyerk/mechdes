                                    <i class="fa-solid fa-circle-dot me-1" aria-hidden="true"></i> ICs
                                </button>
                                <button type="button" class="btn btn-outline-danger flex-fill" id="01butReset">
                                    <i class="fa-solid fa-rotate-right me-1" aria-hidden="true"></i> Defaults
                                </button>
                            </div>

                                <div class="col-6 col-sm-4">
                                    <label for="01A" class="form-label small fw-bold mb-1">a (10-1000 mm)</label>
                                    <input class="form-control form-control-sm numberBox" id="01A" type="number" min="10" max="1000" step="10">

                                <div class="col-6 col-sm-4">
