name: Update Footer Version Tag

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  update-footer:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get Latest Tag or Commit SHA
        id: get_version
        run: |
          # Fetch all tags from remote
          git fetch --tags
          # Get the latest tag on main, or fall back to the short commit SHA if no tag exists
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || git rev-parse --short HEAD)
          echo "VERSION=$LATEST_TAG" >> $GITHUB_OUTPUT

      - name: Replace Placeholder in Footer
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          FILE="src/includes/footer.html"
          
          # Replace text between <!-- VERSION --> and <!-- /VERSION -->
          sed -i -E "s|(<!-- VERSION -->).*?(<!-- /VERSION -->)|\1${VERSION}\2|g" "$FILE"

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add src/includes/footer.html
          
          # Commit only if changes were made
          if ! git diff --staged --quiet; then
            git commit -m "chore: update footer version tag to ${{ steps.get_version.outputs.VERSION }} [skip ci]"
            git push
          else
            echo "No changes to commit"
          fi
