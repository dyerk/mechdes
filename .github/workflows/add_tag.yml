name: Update Footer Version Tag

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

concurrency:
  group: update-footer-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  update-footer:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Get Latest Tag or Commit SHA
        id: get_version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            LATEST_TAG="${{ github.ref_name }}"
          else
            LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || git rev-parse --short HEAD)
          fi
          echo "VERSION=$LATEST_TAG" >> "$GITHUB_OUTPUT"

      - name: Replace Placeholder in Footer
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          FILE="src/includes/footer.html"
          
          perl -i -pe "s|(<!-- VERSION -->).*?(<!-- /VERSION -->)|\${1}${VERSION}\${2}|g" "$FILE"

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add src/includes/footer.html
          
          if ! git diff --staged --quiet; then
            git commit -m "chore: update footer version tag to ${{ steps.get_version.outputs.VERSION }} [skip ci]"
            git push origin main
          else
            echo "No changes to commit"
          fi