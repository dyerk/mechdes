<!DOCTYPE HTML>
<html lang="en">
	<head>
		<title>Planetary Gearsets with Multiple Planets</title>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		
		<!-- Bootstrap 5 CSS & FontAwesome 6 -->
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

		<!-- Shared Components Loader Script -->
		<script src="/js_common/load_components.js" defer></script>

		<!-- Custom Stylesheet & Favicon -->
		<link rel="icon" type="image/png" sizes="32x32" href="/img/favicon/favicon-32x32.png">
		<link rel="stylesheet" href="/css/canvas.css">
		
		<!-- Common javascript links -->
		<script src="/js_common/Linkage.js"></script>
		<script src="/js_common/Plot.js"></script>
		<script src="/js_common/Select_Animation.js"></script>
		
		<script src="/js_common/Common_Shapes.js"></script>
		<script src="/js_common/Common_Shapes_Cam.js"></script>
		
		<!-- Page specific javascript links -->
		<script src="/js_common/Common_Shapes_Planetary.js"></script>
		<script src="/js_common/Class_PlanSRP.js"></script>
		<script src="/js_common/Class_PlanS2P2.js"></script>
		<script src="/pages/gears/js/balancingGears.js"></script>
	</head>
	
	<body class="bg-dark text-light d-flex flex-column min-vh-100">
		<!-- NAVIGATION CONTAINER -->
		<header id="navbar-placeholder" data-nav-path="/includes/navbar.html"></header>
	
		<!-- PAGE CONTENT -->
		<main class="container my-4 flex-grow-1 bg-white text-dark p-4 rounded-3">
			<h1 class="h2">Planetary Gearsets</h1>
			<h2 class="h4 text-muted">Balancing Gearsets with Multiple Planets</h2>

			<!-- Animation Selection Navigation (Nav Pills) -->
			<nav aria-label="Animation Selection" class="mt-3 border-bottom border-3">
				<ul id="sliderLinks" class="nav nav-pills justify-content-center bg-light p-2 rounded-top border">
					<li class="nav-item">
						<button class="nav-link itemLinks active" data-pos="0" id="pill-trad-planetary-tab" type="button" aria-selected="true">
							Traditional Planetary<br><small class="fw-normal">(3 Lobe Balance)</small>
						</button>
					</li>   		
					<li class="nav-item">
						<button class="nav-link itemLinks" data-pos="1" id="pill-suns-planets-tab" type="button" aria-selected="false">
							2 Suns & 2 Planets<br><small class="fw-normal">(3 Lobe Balance)</small>
						</button>
					</li> 
				</ul>
			</nav>

			<!-- ITEM 1: Traditional Planetary (3 Lobe Balance) -->
			<section id="item01" class="animationContainer mb-4">
				<div class="row g-4 align-items-start">
					
					<!-- Left Column: Canvas Animation & Controls -->
					<div class="col-12">
						<figure class="figure w-100 m-0">
							<div class="animationCanvas border rounded-bottom p-2 bg-light">
								<div class="canvas-wrapper">
									<canvas class="canTrace" id="01canTr" width="500" height="400"></canvas>
									<canvas class="canDraw z_2" id="01canM1" width="500" height="400"></canvas>
									<canvas class="canDraw z_3" id="01canM2" width="500" height="400"></canvas>
									<canvas class="canDraw z_4" id="01canM3" width="500" height="400"></canvas>
									<canvas class="canDraw z_5" id="01canGr" width="500" height="400"></canvas>
								</div>
								
								<!-- Animation Controls -->
								<div class="d-flex justify-content-center gap-3 mt-2">
									<button type="button" class="btn btn-outline-primary" id="01btnPlay" aria-label="Play animation">
										<i class="fa-solid fa-circle-play fa-2xl" id="01butPlay" aria-hidden="true"></i>
									</button>
									<button type="button" class="btn btn-outline-secondary" id="01btnReset" aria-label="Reset animation">
										<i class="fa-solid fa-rotate-right fa-2xl button-disabled" id="01butReset" aria-hidden="true"></i>
									</button>
								</div>
							</div>
							
							<figcaption class="figure-caption text-center mt-2">
								<h3 id="01cap" class="h6 mb-0 fw-semibold">The traditional sun-ring-planet gearset with three balancing lobes.</h3>
							</figcaption>
						</figure>
					</div>
			</section>

			<!-- ITEM 2: 2 Suns & 2 Planets (3 Lobe Balance) -->
			<section id="item02" class="animationContainer mb-4 d-none">
				<div class="row g-4 align-items-start">
					
					<!-- Left Column: Canvas Animation & Controls -->
					<div class="col-12">
						<figure class="figure w-100 m-0">
							<div class="animationCanvas border rounded-bottom p-2 bg-light">
								<div class="canvas-wrapper">
									<canvas class="canTrace" id="02canTr" width="500" height="400"></canvas>
									<canvas class="canDraw z_2" id="02canM1" width="500" height="400"></canvas>
									<canvas class="canDraw z_3" id="02canM2" width="500" height="400"></canvas>
									<canvas class="canDraw z_4" id="02canM3" width="500" height="400"></canvas>
									<canvas class="canDraw z_5" id="02canGr" width="500" height="400"></canvas>
								</div>
								
								<!-- Animation Controls -->
								<div class="d-flex justify-content-center gap-3 mt-2">
									<button type="button" class="btn btn-outline-primary" id="02btnPlay" aria-label="Play animation">
										<i class="fa-solid fa-circle-play fa-2xl" id="02butPlay" aria-hidden="true"></i>
									</button>
									<button type="button" class="btn btn-outline-secondary" id="02btnReset" aria-label="Reset animation">
										<i class="fa-solid fa-rotate-right fa-2xl button-disabled" id="02butReset" aria-hidden="true"></i>
									</button>
								</div>
							</div>
							
							<figcaption class="figure-caption text-center mt-2">
								<h3 id="02cap" class="h6 mb-0 fw-semibold">The two-suns, two-planets gearset with three balancing lobes.</h3>
							</figcaption>
						</figure>
					</div>

				</div>
			</section>
		</main>
		
		<!-- FOOTER CONTAINER -->
		<footer id="footer-placeholder" data-footer-path="/includes/footer.html"></footer>

		<!-- Bootstrap JS Bundle -->
		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
	</body>
</html>
