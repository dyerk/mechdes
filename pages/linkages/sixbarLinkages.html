						<figure class="figure w-100 m-0">
							<div class="animationCanvas border rounded-bottom p-2 bg-light">
								<div class="canvas-wrapper">
									<canvas class="canTrace" id="01canTr" width="500" height="400"></canvas>
									<canvas class="canDraw z_2" id="01canM1" width="500" height="400"></canvas>
									<canvas class="canDraw z_3" id="01canM2" width="500" height="400"></canvas>
									<canvas class="canDraw z_4" id="01canM3" width="500" height="400"></canvas>
									<canvas class="canDraw z_5" id="01canGr" width="500" height="400"></canvas>
								</div>
								
								<!-- Animation Controls -->
								<div class="d-flex justify-content-center gap-3 mt-2">
									<button type="button" class="btn btn-outline-primary" id="01btnPlay" aria-label="Play animation">
										<i class="fa-solid fa-circle-play fa-2xl" id="01butPlay" aria-hidden="true"></i>
									</button>
									<button type="button" class="btn btn-outline-secondary" id="01btnReset" aria-label="Reset animation">
										<i class="fa-solid fa-rotate-right fa-2xl button-disabled" id="01butReset" aria-hidden="true"></i>
									</button>
								</div>
							</div>
							
							<figcaption class="figure-caption text-center mt-2">
								<h3 id="01cap" class="h6 mb-0 fw-semibold"><b>Stephenson's Type I Sixbar Linkage:</b> Ground is one of the two-pin links connecting both three-pin links and the crank is a three-pin link.</h3>
							</figcaption>
						</figure>
					</div>

				</div>
			</section>
